name: Cloud video campaign
run-name: Cloud video campaign ${{ inputs.dispatch_id }}

on:
  schedule:
    - cron: '53 4 * * *'
    - cron: '23 9,15 * * *'
    - cron: '20 6 * * *'
    - cron: '50 10,16 * * *'
    - cron: '10 17 * * 0'
    - cron: '13 */2 * * *'
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Independent cloud clock correlation (optional)
        type: string
        required: false
      mode:
        description: Campaign action
        type: choice
        default: preflight
        options: [preflight, bootstrap, smoke, audit, scheduled, prepare, review, prime, refresh-media, upgrade-creative, growth-test, viewer-response]

      request_topic:
        description: Allowed research topic
        type: string
        required: false
      request_subject:
        description: Public product identifier, when required
        type: string
        required: false
      request_origin:
        description: Synthetic test flag, when applicable
        type: string
        required: false
      request_id:
        description: Random opaque request identifier
        type: string
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: cwuc-campaign
  cancel-in-progress: false

jobs:
  campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      INDIEPOST_API_KEY: ${{ secrets.INDIEPOST_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REQUESTED_MODE: ${{ inputs.mode }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}
      REQUEST_TOPIC: ${{ inputs.request_topic }}
      REQUEST_ID: ${{ inputs.request_id }}
      REQUEST_SUBJECT: ${{ inputs.request_subject }}
      REQUEST_ORIGIN: ${{ inputs.request_origin }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: creative-requirements.txt
      - name: Install approved creative authoring dependencies
        run: python3 -m pip install -r creative-requirements.txt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/cwuc-voice-assets
          key: cwuc-kokoro-model-files-v1.1-${{ runner.os }}-${{ runner.arch }}
      - name: Check campaign safety guards
        run: |
          python3 -m unittest -q test_campaign.py test_creative.py test_response.py test_product_response.py test_comparison_response.py test_response_schedule.py > safety-fixture-output.log
          (cd comment-monitor && python3 -m unittest -q test_native_verifier.py test_health_signal.py test_monitor_status.py)
      - name: Read-only backup connection check
        run: python3 indiepost_remaining_test.py
      - name: Install video validation tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run bounded cloud workflow
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          mode="${REQUESTED_MODE:-scheduled}"
          if [[ "$EVENT_SCHEDULE" == '50 10,16 * * *' || "$EVENT_SCHEDULE" == '20 6 * * *' ]]; then mode=audit; fi
          if [[ "$EVENT_SCHEDULE" == '10 17 * * 0' ]]; then mode=review; fi
          if [[ "$mode" == smoke ]]; then export ALLOW_SMOKE=1; fi
          python3 campaign.py --mode "$mode" --request-topic "$REQUEST_TOPIC" --request-id "$REQUEST_ID" --request-subject "$REQUEST_SUBJECT" --request-origin "$REQUEST_ORIGIN"
