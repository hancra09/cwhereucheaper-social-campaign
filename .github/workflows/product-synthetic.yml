name: Synthetic product request video test
on:
  push:
    branches: [verified-product-response-20261114]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r creative-requirements.txt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/cwuc-voice-assets
          key: cwuc-kokoro-model-files-v1.1-${{ runner.os }}-${{ runner.arch }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 -m unittest -v test_product_response.py
      - run: python3 synthetic_unit_response.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python3 synthetic_product_response.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-product-video
          path: synthetic-output/
          retention-days: 7
