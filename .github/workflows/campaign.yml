name: Cloud video campaign

on:
  schedule:
    - cron: '53 4 * * *'
    - cron: '23 9,15 * * *'
    - cron: '20 6 * * *'
    - cron: '50 10,16 * * *'
    - cron: '10 17 * * 0'
    - cron: '13 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Campaign action
        type: choice
        default: preflight
        options: [preflight, bootstrap, smoke, audit, scheduled, prepare, review, prime, refresh-media]

permissions:
  contents: write
  actions: write

concurrency:
  group: cwuc-campaign
  cancel-in-progress: false

jobs:
  campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REQUESTED_MODE: ${{ inputs.mode }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check campaign safety guards
        run: python3 -m unittest -q test_campaign.py
      - name: Install video validation tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run bounded cloud workflow
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          mode="${REQUESTED_MODE:-scheduled}"
          if [[ "$EVENT_SCHEDULE" == '50 10,16 * * *' || "$EVENT_SCHEDULE" == '20 6 * * *' ]]; then mode=audit; fi
          if [[ "$EVENT_SCHEDULE" == '10 17 * * 0' ]]; then mode=review; fi
          if [[ "$mode" == smoke ]]; then export ALLOW_SMOKE=1; fi
          python3 campaign.py --mode "$mode"
